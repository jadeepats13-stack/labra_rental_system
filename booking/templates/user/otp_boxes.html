{% comment %}6 boxes for the emailed code. landing.js joins them into the hidden "code" field (typing, pasting and autofill all work).{% endcomment %}
<div class="otp" data-otp role="group" aria-label="6-digit code">
    <input type="hidden" name="code">
    {% for i in "123456" %}<input class="otp-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
        aria-label="Digit {{ forloop.counter }}" autocomplete="{% if forloop.first %}one-time-code{% else %}off{% endif %}">{% endfor %}
</div>
<small class="field-error" data-otp-error></small>
