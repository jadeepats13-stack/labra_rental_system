{% comment %}
Sun/moon theme switch. Light mode shows the sun, dark mode shows the moon.
   Use: {% include 'common/theme_toggle.html' with key='labra-theme-admin' %} (needs js/common/theme_toggle.js)
{% endcomment %}
<button type="button" class="theme-toggle" data-theme-toggle data-theme-key="{{ key }}"
    aria-label="Dark mode" aria-pressed="false" title="Switch to dark mode">
    <svg class="icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
    <svg class="icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </svg>
</button>
