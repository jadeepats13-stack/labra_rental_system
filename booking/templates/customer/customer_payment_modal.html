{% load static %}
<div class="modal-overlay" id="paymentModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="paymentModalTitle">
        <div class="modal-head">
            <h2 class="modal-title" id="paymentModalTitle">Complete Payment</h2>
            <button type="button" class="modal-x" onclick="closePaymentModal()" aria-label="Close">
                <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
            </button>
        </div>

        <div class="summary-card" id="paymentSummary">
            <div class="summary-row"><span class="label">Booking ID</span><span class="value" id="sum-booking">#—</span>
            </div>
            <div class="summary-row"><span class="label">Court</span><span class="value" id="sum-court">—</span>
            </div>
            <div class="summary-row"><span class="label">Date</span><span class="value" id="sum-date">—</span></div>
            <div class="summary-row"><span class="label">Time</span><span class="value" id="sum-time">—</span></div>
            <div class="summary-row total"><span class="label">Total Amount</span><span class="value"
                    id="sum-total">₱0.00</span></div>
        </div>

        <form method="POST" action="{% url 'process_payment' %}" id="cashPaymentForm">
            {% csrf_token %}
            <input type="hidden" name="booking_id" id="pay-booking-id">
            <input type="hidden" name="payment_method" value="Cash">

            <fieldset class="pay-fieldset">
                <legend class="form-label">Payment method</legend>
                <div class="payment-methods">
                    <label class="payment-method" onclick="selectPayMethod(this)">
                        <input type="radio" name="payment_method" value="Cash" class="visually-hidden" required>
                        <svg class="icon" aria-hidden="true"><use href="#i-wallet"/></svg>
                        <span class="payment-method-name">Cash</span>
                        <span class="payment-method-desc">Pay at the court</span>
                    </label>
                    <label class="payment-method" onclick="selectPayMethod(this)">
                        <input type="radio" name="payment_method" value="Online" class="visually-hidden">
                        <svg class="icon" aria-hidden="true"><use href="#i-card"/></svg>
                        <span class="payment-method-name">Online Payment</span>
                        <span class="payment-method-desc">Pay via PayPal</span>
                    </label>
                </div>
            </fieldset>

            <div id="dashboard-paypal-container" style="display:none; margin: 16px 0;"></div>

            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="closePaymentModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" id="dashboard-pay-btn">Confirm Payment</button>
            </div>
        </form>
    </div>
</div>
