{% load static %}

<head>
    <link rel="stylesheet" href="{% static 'css/customer/customer_profile.css' %}">
</head>
<div class="page-content" id="page-profile">
    <div class="section-header">
        <div class="section-title">Edit Profile</div>
    </div>

    <div class="profile-grid">
        <div class="profile-avatar-card">
            <div class="profile-avatar-large">
                {% if customer.profile_picture %}
                <img src="{{ customer.profile_picture.url }}" alt="Profile">
                {% else %}
                {{ customer.firstname|first }}{{ customer.lastname|first }}
                {% endif %}
            </div>
            <div class="profile-name">{{ customer.firstname }} {{ customer.lastname }}</div>
            <div class="profile-username">@{{ customer.username }}</div>
        </div>

        <form method="POST" action="{% url 'update_profile' %}">
            {% csrf_token %}
            <div class="form-card" style="height:100%;">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">First Name</label>
                        <input type="text" name="firstname" class="form-control" value="{{ customer.firstname }}"
                            required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="lastname" class="form-control" value="{{ customer.lastname }}"
                            required>
                    </div>
                    <div class="form-group full">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" value="{{ customer.username }}"
                            required>
                    </div>
                    <div class="form-group full">
                        <label class="form-label">Email <span style="color:var(--gray);font-size:11px;">(for booking
                                confirmation emails)</span></label>
                        <input type="email" name="email" class="form-control" value="{{ customer.email }}"
                            placeholder="you@example.com">
                    </div>
                    <div class="form-group full">
                        <label class="form-label">New Password <span style="color:var(--gray);font-size:11px;">(leave
                                blank to keep
                                current)</span></label>
                        <input type="password" name="new_password" class="form-control"
                            placeholder="Enter new password">
                    </div>
                    <div class="form-group full">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control"
                            placeholder="Confirm new password">
                    </div>
                </div>
                <div style="margin-top:24px;">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </form>
    </div>
</div>
